name: Battery Analysis CI-CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Sync dependencies from lockfile
      run: uv sync --all-extras --frozen

    - name: Lint with ruff
      run: |
        uv run ruff check src/ tests/ scripts/ --output-format=github
    
    - name: Run tests with pytest
      env:
        QT_QPA_PLATFORM: offscreen
      run: uv run pytest
    
    - name: Install UPX (optional, for smaller exe)
      run: choco install upx --version 5.0.0 -y
      continue-on-error: true
    - name: Run build script
      run: |
        uv run python scripts/build.py Release
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: battery-analysis-build
        path: build/
        retention-days: 7

  release:
    runs-on: windows-latest
    permissions:
      contents: write
    needs: build-and-test
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: battery-analysis-build
        path: build/

    - name: Generate release information
      id: release_info
      run: |
        $tagName = "${{ github.ref_name }}"
        # 含 beta/alpha/rc 视为预发布
        $isPrerelease = ($tagName -match '(beta|alpha|rc)')
        echo "release_name=$tagName" >> $env:GITHUB_OUTPUT
        echo "is_prerelease=$($isPrerelease.ToString())" >> $env:GITHUB_OUTPUT
        echo "is_latest=$((-not $isPrerelease).ToString())" >> $env:GITHUB_OUTPUT
        Write-Host "Generated release name: $tagName (prerelease=$isPrerelease)"
      shell: pwsh

    - name: Generate changelog
      id: changelog
      run: |
        $releaseName = "${{ steps.release_info.outputs.release_name }}"
        $changelog = uv run python scripts/generate_changelog.py --output --version $releaseName 2>&1
        # 去掉脚本的 "Fetching..." / "Found ..." 前缀行，只保留 markdown 内容
        $md = ($changelog | Where-Object { $_ -match '^###|^####|^- ' }) -join "`n"
        # 写入多行 output（用 heredoc 语法）
        echo "body<<CHANGELOG_EOF" >> $env:GITHUB_OUTPUT
        echo "$md" >> $env:GITHUB_OUTPUT
        echo "CHANGELOG_EOF" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Create GitHub Release
      id: create_release
      run: |
        $releaseName = "${{ steps.release_info.outputs.release_name }}"
        $isPrerelease = "${{ steps.release_info.outputs.is_prerelease }}"
        $releaseType = if ($isPrerelease -eq 'True') { '预发布构建版本' } else { '正式构建版本' }
        $tagName = if ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq 'True') { "${{ github.ref_name }}" } else { $releaseName }
        $changelogBody = "${{ steps.changelog.outputs.body }}"

        $body = @"
$releaseType - Release模式
构建编号: ${{ github.run_number }}
版本号: $releaseName
提交SHA: ${{ github.sha }}
分支: ${{ github.ref_name }}

$changelogBody
"@

        # 写入临时文件（避免命令行转义问题）
        $body | Out-File -FilePath release_body.md -Encoding utf8

        $ghArgs = @('release', 'create', $tagName,
          '--title', $releaseName,
          '--notes-file', 'release_body.md',
          '--target', '${{ github.sha }}')

        if ($isPrerelease -eq 'True') {
          $ghArgs += '--prerelease'
        } else {
          $ghArgs += '--latest'
        }

        gh @ghArgs
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload release assets
      run: |
        $tagName = "${{ github.ref_name }}"
        $exeFiles = Get-ChildItem -Path build/Release -Filter *.exe | Select-Object -ExpandProperty FullName
        foreach ($file in $exeFiles) {
          Write-Host "Uploading $file..."
          gh release upload $tagName $file --clobber
        }
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}