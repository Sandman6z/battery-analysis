name: Sync to Gitee

on:
  release:
    types: [published, released]
  push:
    tags:
      - 'v*'  # 同步以 v 开头的标签
    branches:
      - 'main'  # 同步 main 分支
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-to-gitee:
    runs-on: windows-latest
    permissions:
      contents: write  # 确保有写入权限
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取所有历史记录，包括标签

    - name: Setup Git config
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "zbnsandman@google.com"
      shell: pwsh

    - name: Check if Gitee secrets are configured
      id: check_secrets
      run: |
        if (-not (Test-Path env:GITEE_USERNAME) -or [string]::IsNullOrEmpty($env:GITEE_USERNAME)) {
          "secrets_configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Warning "GITEE_USERNAME secret is not configured"
        } elseif (-not (Test-Path env:GITEE_TOKEN) -or [string]::IsNullOrEmpty($env:GITEE_TOKEN)) {
          "secrets_configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Warning "GITEE_TOKEN secret is not configured"
        } else {
          "secrets_configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Gitee secrets are configured"
        }
      shell: pwsh

    - name: Add Gitee remote repository
      if: steps.check_secrets.outputs.secrets_configured == 'true'
      run: |
        # 获取仓库名称
        $repoName = $env:GITHUB_REPOSITORY.Split('/')[1]

        # 移除现有的 gitee 远程仓库（如果存在），忽略不存在时的报错
        $ErrorActionPreference = 'SilentlyContinue'
        git remote remove gitee
        $ErrorActionPreference = 'Stop'
        Write-Output "No existing gitee remote to remove (or removed successfully)"

        # remote URL 不含凭据（token 仅经 http.extraheader 传递，避免 git remote -v 泄漏）
        $giteeRepoUrl = "https://gitee.com/${env:GITEE_USERNAME}/${repoName}.git"
        git remote add gitee $giteeRepoUrl

        # 只展示 remote 名称，不打印 URL（URL 不含凭据，但为谨慎不输出完整地址）
        $ErrorActionPreference = 'SilentlyContinue'
        git remote show -n gitee | Select-Object -First 1 | ForEach-Object { "Gitee remote configured for $repoName" }
        $ErrorActionPreference = 'Stop'
      shell: pwsh

    - name: Push to Gitee
      if: steps.check_secrets.outputs.secrets_configured == 'true'
      run: |
        Write-Output "正在同步到 Gitee..."
        Write-Output "触发事件: $env:GITHUB_EVENT_NAME"
        Write-Output "引用: $env:GITHUB_REF"

        # 凭据仅经 http.extraheader 传递，绝不进入 remote URL
        $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:GITEE_USERNAME}:${env:GITEE_TOKEN}"))

        # 禁用 Git Credential Manager 干预
        $env:GIT_TERMINAL_PROMPT = '0'
        $env:GCM_INTERACTIVE = 'never'

        # 根据触发事件确定要推送的内容
        if ($env:GITHUB_EVENT_NAME -eq 'push') {
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagName = $env:GITHUB_REF_NAME
            Write-Output "推送标签 $tagName 到 Gitee..."
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push gitee "refs/tags/$tagName"
          } else {
            $branchName = $env:GITHUB_REF_NAME
            Write-Output "推送分支 $branchName 到 Gitee..."
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push gitee "$branchName"
          }
        } elseif ($env:GITHUB_EVENT_NAME -eq 'release') {
          $releaseTag = $env:GITHUB_REF_NAME
          Write-Output "推送 Release 标签 $releaseTag 到 Gitee..."
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push gitee "refs/tags/$releaseTag"

          Write-Output "推送 main 分支到 Gitee..."
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push gitee main
        } else {
          $currentBranch = git branch --show-current
          Write-Output "推送当前分支 $currentBranch 到 Gitee..."
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push gitee "$currentBranch"
        }
      shell: pwsh