site_name: Battery Analysis Tool
site_description: 电池数据分析工具文档
site_url: https://sandman6z.github.io/battery-analysis
repo_url: https://github.com/Sandman6z/battery-analysis
repo_name: Sandman6z/battery-analysis

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 首页: index.md
  - 快速开始: QUICK_START.md
  - 使用指南: USER_GUIDE.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

exclude_docs: |
  superpowers/
  *.pdf
  CHANGELOG_GUIDE.md
  DOCSTRING_GUIDE.md
  FIX_XML_AUTO_POPULATE.md
  INTERNATIONALIZATION.md
  NUITKA_BUILD.md
  OPTIMIZATION_SUMMARY.md
  README_PYLINT.md
  TESTING_GUIDE.md
  QUICK_START_EN.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Sandman6z/battery-analysis
